name: Publish BookKit Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bookkit-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bookkit-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone BookKit preview
        shell: bash
        run: |
          mkdir -p site
          wget --quiet --recursive --level=2 --page-requisites --convert-links --adjust-extension --no-host-directories --directory-prefix=site https://veya-booking.sockzgobrazy.chatgpt.site/
          test -f site/index.html
          find site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 | xargs -0 sed -i             -e 's/Veya Booking/BookKit/g'             -e 's/Veya/BookKit/g'             -e 's/veya\.com/bookkit.app/g'             -e 's/>veya</>BookKit</g'
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy BookKit
        id: deployment
        uses: actions/deploy-pages@v4
