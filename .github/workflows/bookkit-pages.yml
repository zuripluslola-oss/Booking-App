name: Publish BookKit to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - ".github/workflows/bookkit-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bookkit-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Bookkit site
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Bookkit
        id: deployment
        uses: actions/deploy-pages@v4
